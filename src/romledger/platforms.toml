# One table per RomM platform slug (verified with igir's {romm} token on 2026-10-13).
# dat: <set>/<name> under libretro-database metadat. vimm, coolrom, consoleroms, emuland: site
# system codes.
# [ignore] lists site systems that are deliberately unsupported (no console DAT is mapped).

[ignore]
vimm = ["WiiWare", "X360-D"]
coolrom = ["c64", "cps1", "cps2", "mame", "model2", "namcosystem22", "neogeo", "neogeocd"]
consoleroms = [
    "3do", "amiga", "apple-2", "atari-st", "bbc-micro", "commodore-64-preservation",
    "commodore-64-tapes", "cps1", "cps2", "cps3", "dos", "famicom", "mame", "new-geo", "pc-fx",
    "scummvm", "sega-naomi", "sharp-x68000", "turbo-duo", "wonderswan", "wonderswan-color",
    "zx-spectrum",
]
emuland = [
    "arcade/cps", "arcade/ki", "arcade/mame", "arcade/n22", "arcade/neogeo", "arcade/zinc",
    "computers/amiga", "computers/atari_8bit", "computers/atari_st", "computers/c64",
    "computers/coco", "computers/cpc", "computers/msx1", "computers/msx2", "computers/mtx",
    "computers/oric", "computers/x86", "computers/zx81", "computers/zx_spectrum",
    "consoles/3do", "consoles/arcadia", "consoles/chaf", "consoles/coleco",
    "consoles/famicom_disk_system", "consoles/intellivision", "consoles/neogeocd",
    "consoles/sg-1000", "consoles/vectrex", "portable/pmini", "portable/sv", "portable/ws",
]

