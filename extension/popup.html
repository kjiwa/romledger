<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>romledger</title>
<link rel="stylesheet" href="romledger.css">
<link rel="stylesheet" href="ui.css">
<script src="lib/romledger.js" defer></script>
<script src="popup.js" defer></script>
</head>
<body class="popup">
<main class="ui">
  <h1>romledger</h1>
  <div class="notices">
    <p id="error" class="romledger-notice" data-kind="error" role="alert" hidden></p>
    <p id="empty" class="romledger-notice" role="status" hidden></p>
    <p id="page" class="romledger-notice" role="status" hidden></p>
    <p id="import" class="romledger-notice" role="status" hidden></p>
  </div>
  <ul id="platforms" class="platforms" aria-label="Platforms"></ul>
  <div class="actions">
    <button id="options" class="romledger-button" type="button">Options</button>
  </div>
</main>
</body>
</html>
