[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "romledger"
version = "0.1.0"
description = "Track which retro games you have and which are missing, verified against No-Intro and Redump DATs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.1",
]

[project.scripts]
romledger = "romledger.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/romledger"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=romledger --cov-report=term-missing -m 'not igir and not live'"
markers = [
    "igir: runs the real igir (needs Node.js)",
    "live: requests real sites (one page per source, never a ROM)",
]

[tool.coverage.report]
fail_under = 90
