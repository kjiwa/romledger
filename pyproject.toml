[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "romledger"
version = "0.6.0"
description = "Track which retro games you have and which are missing, verified against No-Intro and Redump DATs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kamil Jiwa" }]
keywords = ["retro-gaming", "emulation", "roms", "no-intro", "redump", "igir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "httpx[socks]>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/kjiwa/romledger"
Documentation = "https://github.com/kjiwa/romledger/tree/master/docs"
Issues = "https://github.com/kjiwa/romledger/issues"
Changelog = "https://github.com/kjiwa/romledger/blob/master/CHANGELOG.md"

[project.scripts]
romledger = "romledger.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs/images"]

[tool.hatch.build.targets.wheel]
packages = ["src/romledger"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/demo_library.py" = ["S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=romledger --cov-report=term-missing -m 'not igir and not live'"
markers = [
    "igir: runs the real igir (needs Node.js)",
    "live: requests real sites (one page per source, never a ROM)",
]

[tool.coverage.report]
fail_under = 90
